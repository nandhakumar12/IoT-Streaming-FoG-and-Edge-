name: EdgeGuardian CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint Python Sensor Simulator ───────────────────────────────────────────
  lint-sensors:
    name: Lint Python Sensors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linter
        run: pip install flake8
      - name: Lint sensors
        # E402 = module-level import not at top (suppressed via noqa in source)
        # W503 = line break before binary operator (style preference)
        run: flake8 sensors/ --max-line-length=100 --ignore=E501,W503,E402

  # ── Test Node.js Fog Node ─────────────────────────────────────────────────
  test-fog-node:
    name: Test Fog Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fog-node/package-lock.json
      - name: Install dependencies
        working-directory: fog-node
        run: npm install
      - name: Run unit tests
        working-directory: fog-node
        run: node --test tests/

  # ── Test Backend ───────────────────────────────────────────────────────────
  test-backend:
    name: Test Local Backend
    runs-on: ubuntu-latest
    env:
      # Disable Kafka and Redis in CI — backend gracefully falls back to HTTP-only mode
      KAFKA_BROKER: 'localhost:9092'
      REDIS_HOST: 'localhost'
      NODE_ENV: 'test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Start backend and verify health endpoint
        working-directory: backend
        run: |
          node server.js &
          SERVER_PID=$!
          # Wait up to 15s for the server to start
          for i in $(seq 1 15); do
            sleep 1
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✓ Health check passed"
              kill $SERVER_PID
              exit 0
            fi
            echo "Waiting for server... ($i/15)"
          done
          echo "✗ Server did not respond within 15 seconds"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  # ── Build React Dashboard ─────────────────────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm install
      - name: Build production bundle
        working-directory: dashboard
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/
