# ─────────────────────────────────────────────
# Eclipse Mosquitto 2.x Configuration
# EdgeGuardian MQTT Broker
# ─────────────────────────────────────────────

# TCP listener on port 1883 (MQTT)
listener 1883
protocol mqtt

# WebSocket listener on port 9001 (for browser clients if needed)
listener 9001
protocol websockets

# Allow anonymous connections (no auth required for local dev)
allow_anonymous true

# Persistence: survive broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all

# Message size limit (64KB per message)
message_size_limit 65536

# Max queued messages per client
max_queued_messages 1000

# Keep alive (seconds)
keepalive_interval 60
